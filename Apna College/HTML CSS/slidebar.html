<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Menu</title>

  <!-- Google Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Your Custom CSS -->
  <link rel="stylesheet" href="slidebar.css"> 
</head>
<body>
  <div class="main_box">
    <input type="checkbox" id="check">

    <!-- Open button -->
    <div class="b1">
      <label for="check" >
        <i class="fa-solid fa-bars"></i>
      </label>
    </div>

    <!-- Sidebar -->
    <div class="slide_menu">
      <div class="logo">
        <a href="#">Apna College</a>
      </div>

      <!-- Close button -->
      <div class="b2">
        <label for="check" style="color: gray; font-size: 24px; cursor: pointer;">
          <i class="fa-solid fa-xmark"></i>
        </label>
      </div>

  

      <!-- Menu -->
      <div class="menu">
        <ul>
          <li><a href="#"><i class="fa-solid fa-image"></i> Gallery</a></li>
          <li><a href="#"><i class="fa-solid fa-calendar"></i> Event</a></li>
          <li><a href="#"><i class="fa-solid fa-comment"></i> Feedback</a></li>
          <li><a href="#"><i class="fa-solid fa-address-book"></i> Contact</a></li>
          <li><a href="#"><i class="fa-solid fa-store"></i> Store</a></li>
        </ul>
      </div>

      <!-- Social Icons -->
      <div class="social">
        <ul>
          <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
          <li><a href="#"><i class="fa-brands fa-twitter"></i></a></li>
          <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
          <li><a href="#"><i class="fa-brands fa-linkedin"></i></a></li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
